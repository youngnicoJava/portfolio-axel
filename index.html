<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;450;500;550;600;650;700&family=Manrope:wght@400;500;600;650;700;750;800&display=swap"
      rel="stylesheet"
    />
    <meta
      name="description"
      content="Axel Fecha — Desarrollador de software en Argentina. Proyectos destacados, habilidades técnicas y contacto."
    />
    <meta property="og:title" content="Axel Fecha — Software Developer" />
    <meta
      property="og:description"
      content="Proyectos destacados, habilidades técnicas y la persona detrás del código."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/social-preview.svg" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Add the production canonical URL and absolute social image URL before publishing. -->
    <title>Axel Fecha — Software Developer</title>
    <script>
      try {
        const stored = localStorage.getItem("portfolio-theme");
        document.documentElement.lang =
          localStorage.getItem("portfolio-language") === "en" ? "en" : "es";
        document.documentElement.dataset.theme =
          stored === "light" || stored === "dark"
            ? stored
            : matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
      } catch {
        document.documentElement.dataset.theme = matchMedia(
          "(prefers-color-scheme: dark)",
        ).matches
          ? "dark"
          : "light";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
